spring.application.name=portal

# ============================================================
# Datasource - PostgreSQL
# ============================================================
# The URL does two jobs: it locates the database, and its
# "postgresql" segment is what selects the JDBC driver.
spring.datasource.url=jdbc:postgresql://localhost:5432/smarttriage
spring.datasource.username=postgres

# Resolved at runtime from the OS environment.
# The literal password must never appear in this file - git history is permanent.
spring.datasource.password=${DB_PASSWORD}

# ============================================================
# JPA / Hibernate
# ============================================================
# update = create missing tables/columns, never drop anything.
# NEVER use create or create-drop here: both wipe all data on every startup.
spring.jpa.hibernate.ddl-auto=update

# SQL logging is off by default: it is noisy and slows every request. To see the
# SQL Hibernate generates while developing, run with the "dev" profile
# (SPRING_PROFILES_ACTIVE=dev) - see application-dev.properties.
spring.jpa.show-sql=false

# ============================================================
# Reference data - src/main/resources/data.sql
# ============================================================
# Seeds the triage question bank. "always" is required for a non-embedded
# database; the script is idempotent and never overwrites existing questions.
spring.sql.init.mode=always
# Run the script after Hibernate has created the tables, not before.
spring.jpa.defer-datasource-initialization=true
# The script contains non-ASCII text (the degree sign). Without this it is read
# in the platform charset, which on Windows would corrupt it.
spring.sql.init.encoding=UTF-8

# ============================================================
# Time
# ============================================================
# The zone used for calendar calculations such as patient age.
# A birthday is a local date: in UTC, a patient in India would still be a day
# younger for the first 5.5 hours of their birthday.
smarttriage.time-zone=Asia/Kolkata

# ============================================================
# Security - access tokens
# ============================================================
# Key that signs access tokens: base64, at least 32 bytes. Anyone holding it can
# forge a token for any account, so it comes only from the environment - generate
# one with: openssl rand -base64 32. No default: without it the application
# refuses to start rather than run with a guessable key.
smarttriage.security.jwt-secret=${JWT_SECRET}
# How long an access token stays valid (ISO-8601 duration).
smarttriage.security.token-validity=PT1H
